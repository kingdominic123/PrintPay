# Netlify settings. Node version comes from .nvmrc (22).
[build]
  command = "npm run build"
  publish = "dist"

# Single static page: no SPA rewrite is needed (there is no client-side router),
# so unknown URLs correctly return Netlify's 404 instead of a soft-404.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
